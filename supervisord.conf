[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:frappe]
command=/bin/bash /workspace/start.sh
directory=/workspace
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
