[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:mariadb]
command=/usr/sbin/mysqld
autorestart=true
priority=10
startsecs=5

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autorestart=true
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=30

[program:frappe_init]
directory=/workspace
command=/bin/bash /workspace/init.sh
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
